[project]
name = "fusion-equilibrium-challenge-starter"
version = "0.1.0"
description = "Starter kit for the Fusion Equilibrium Challenge (NeurIPS hackathon)"
readme = "README.md"
requires-python = ">=3.10,<3.13"
dependencies = [
    "numpy>=1.24",
    "pandas>=2.0",
    "pyarrow>=14.0",
    "scipy>=1.11",
    "scikit-learn>=1.3",
    "matplotlib>=3.7",
    "scikit-image>=0.22",
    "datasets>=2.14",
    "plotly>=5.18",
    "torch>=2.5.1",
]

[dependency-groups]
pytorch = [
    "torch>=2.0,<2.6",
]

[tool.uv]
package = false

# Resolve lockfile for the platforms hackathoners typically use.
required-environments = [
    "sys_platform == 'linux' and platform_machine == 'x86_64'",
    "sys_platform == 'darwin' and platform_machine == 'arm64'",
    "sys_platform == 'win32' and platform_machine == 'AMD64'",
]
